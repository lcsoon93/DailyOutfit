# Build dell'app Android a ogni modifica su main (o a mano da "Actions").
# Produce:
#  - app-debug.apk: da installare direttamente sul telefono per provarla
#  - app-release.aab: da caricare sul Play Store (firmato se sono presenti
#    i segreti ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#    ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; vedi DEPLOY.md)
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installa le dipendenze
        run: npm ci

      - name: Copia l'app web nel progetto Android
        run: npx cap sync android

      - name: Prepara la chiave di firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Compila APK di prova e AAB per il Play Store
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION_NAME=$(node -p "require('../package.json').version")
          ./gradlew assembleDebug bundleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME

      - name: Avviso se l'AAB non è firmato
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::AAB non firmato. Aggiungi i segreti della chiave di caricamento (vedi DEPLOY.md) per poterlo caricare sul Play Store."

      - uses: actions/upload-artifact@v6
        with:
          name: dailyoutfit-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
