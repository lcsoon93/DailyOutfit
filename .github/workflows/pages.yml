# Pubblica la versione web (cartella www) su GitHub Pages.
# Funziona quando in Settings → Pages la sorgente è "GitHub Actions" (e il
# repository è pubblico, oppure con GitHub Pro). Se la sorgente è ancora
# "Deploy from a branch", o il repository è privato, non pubblica nulla e
# non segnala errori: in modalità branch il sito resta servito dalla radice
# del repository, dove index.html rimanda a www/.
name: Web

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null) || mode=none
          echo "Modalità di GitHub Pages: ${mode:-none}"
          echo "mode=${mode:-none}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: ${{ needs.check.outputs.mode == 'workflow' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
